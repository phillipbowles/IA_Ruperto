; PlantaIa — logger de maceta inteligente
; Placa: ESP32 DevKit clásico (equivale al FQBN esp32:esp32:esp32)
;
; Build:    pio run
; Subir:    pio run -t upload
; Monitor:  pio device monitor
; Todo:     pio run -t upload -t monitor

; `pio run` a secas compila sólo la placa; los tests del host van con -e native.
[platformio]
default_envs = esp32dev

[env:esp32dev]
platform  = espressif32@6.9.0     ; Arduino core 2.0.x — analogReadMilliVolts disponible
board     = esp32dev
framework = arduino

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed    = 921600

; El puerto se autodetecta; descomentar y fijar si hay más de una placa conectada.
; upload_port  = /dev/cu.usbserial-0001
; monitor_port = /dev/cu.usbserial-0001

; Versiones fijas a propósito: el mismo commit tiene que compilar igual en
; cualquier máquina del equipo. No aflojar a "*" ni sacar el pin.
lib_deps =
    bblanchon/ArduinoJson@^7.1.0
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
    marcoschwartz/LiquidCrystal_I2C@^1.1.4

build_flags =
    -DCORE_DEBUG_LEVEL=1

; Ninguna carpeta de test/ es una suite para la placa: test_dht es un .ino de
; diagnóstico que se flashea a mano (no es Unity), y test_features, test_modelo
; y test_replay son del host ([env:native], tienen main() propio).
test_ignore = *

; ─── Tests en el host ───────────────────────────────────────────────────────
; lib/plantaia_ml es C++ puro (sin Arduino.h), así que el buffer, las features y
; el modelo exportado se prueban en la computadora, sin placa:
;
;   pio test -e native                      # todas las suites
;   pio test -e native -f test_replay -v    # replay con las líneas [INF]
;
; test_build_src queda en "no" (default): src/main.cpp necesita Arduino y no se
; compila acá; los tests linkean sólo contra la librería.
[env:native]
platform       = native
test_framework = unity
test_ignore    = test_dht
build_flags    =
    -std=gnu++17
    -Wall
    -Wextra
