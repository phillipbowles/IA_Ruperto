; Segunda placa: AI-Thinker ESP32-CAM + OV2640.
; No compila junto al firmware de sensores de ../src/main.cpp.

[platformio]
src_dir = .

[env:esp32cam]
platform  = espressif32@6.9.0
board     = esp32cam
framework = arduino
build_src_filter = +<camera.ino>

monitor_speed = 115200
upload_speed  = 115200

build_flags =
    -DCORE_DEBUG_LEVEL=1

; Para cargar con USB-TTL: GPIO0 a GND, reiniciar, `pio run -t upload`.
; Para ejecutar: quitar GPIO0 de GND y reiniciar.
