# Alembic — migraciones del esquema de PlantaIa
#
# La URL NO se escribe acá: sale de DATABASE_URL en alembic/env.py, para que el
# mismo archivo sirva en el compose local y en Railway sin editar nada.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Las revisiones se numeran a mano (0001, 0002...) en vez de con hash aleatorio:
# el orden se lee de un vistazo en el listado de archivos.
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
