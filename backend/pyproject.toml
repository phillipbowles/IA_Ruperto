[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plantaia-backend"
version = "1.1.0"
description = "API de ingesta y análisis para la maceta inteligente"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.9",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
# Se instalan en el contenedor de desarrollo, no en el de producción.
dev = [
    "pytest>=8.0.0",
    "httpx2>=0.1.0",
    "ruff>=0.6.0",
]
# Para los notebooks: `pip install -e backend/[ml]` deja disponible
# `from app.ml.features import construir_features`, el MISMO código que corre
# en la API. Sin esto la separación de carpetas garantiza el train/serve skew.
ml = [
    "pandas>=2.2.0",
    "scikit-learn>=1.5.0",
    "joblib>=1.4.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
